<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SlideGen Preview — {{ topic }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #111;
    color: #e8e8e8;
    padding: 48px;
    min-height: 100vh;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .meta {
    color: #666;
    font-size: 13px;
    margin-top: 6px;
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    max-width: 1400px;
  }

  .slide-card img {
    width: 100%;
    border-radius: 8px;
    display: block;
  }

  .slide-card .label {
    font-size: 11px;
    color: #555;
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .caption-box {
    margin-top: 40px;
    background: #1a1a1a;
    padding: 24px;
    border-radius: 10px;
    max-width: 540px;
    border: 1px solid #222;
  }

  .caption-box h3 {
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .caption-box p {
    font-size: 14px;
    line-height: 1.6;
    color: #ccc;
  }

  .tags {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    background: #222;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    color: #888;
    border: 1px solid #2a2a2a;
  }
</style>
</head>
<body>
  <h1>{{ topic }}</h1>
  <p class="meta">Generated {{ timestamp }} &middot; Non-branded aesthetic</p>

  <div class="grid">
    {% for slide in slides %}
    <div class="slide-card">
      <img src="slide_{{ loop.index }}.png" alt="Slide {{ loop.index }}">
      <div class="label">{{ loop.index }}. {{ slide.role | replace('_', ' ') | lower }}</div>
    </div>
    {% endfor %}
  </div>

  <div class="caption-box">
    <h3>Caption</h3>
    <p>{{ caption }}</p>
    <div class="tags">
      {% for tag in hashtags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
</body>
</html>
