    Six things I really wish someone told me about money when I was 20.

    Your TFSA room is already building. Small amounts add up over years. Subscriptions drain your account fast. Your credit score is being tracked right now. Filing taxes gets you free money. And saving should actually feel good.

    None of this is complicated. You just need to start.

