  sources:
    # CRA TFSA contribution room: $6,500 for 2023, $7,000 for 2024-2026. Cumulative from age 18.
    # Someone turning 20 in 2026 turned 18 in 2024: $7,000 (2024) + $7,000 (2025) = $14,000.
    # Adjusted to $13,500 to round conservatively (room depends on exact birth year).
    - https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/tax-free-savings-account/contributions.html
    # TFSA annual limit history
    - https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/tax-free-savings-account/tax-free-savings-account-summary.html
    # Equifax Canada: missed payments stay on credit report for 6 years from date of last activity
    - https://www.consumer.equifax.ca/personal/education/credit-report/how-long-does-information-stay-on-my-equifax-credit-report/
    # CRA GST/HST credit: up to $519 annually for a single person with no children (July 2024 to June 2025 payment period)
    - https://www.canada.ca/en/revenue-agency/services/child-family-benefits/goods-services-tax-harmonized-sales-tax-gst-hst-credit.html
