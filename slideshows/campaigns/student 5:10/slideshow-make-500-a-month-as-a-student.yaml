    # Option 6: paid research studies on campus
    - text: "sign up for paid research studies"
      sub: "psych and business departments pay $15-50 per session"
      image: { url: "https://www.mtholyoke.edu/sites/default/files/styles/1024x800/public/2025-10/psych-students-observing-research.jpg?itok=5CU-ABuE" }
      focus: "50% 50%"
    # App slide: bridge income to saving and Lodavo
    - app: hero
