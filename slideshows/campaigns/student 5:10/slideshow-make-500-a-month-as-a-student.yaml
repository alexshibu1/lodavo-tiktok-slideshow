  caption: |
    $500 a month as a student is very doable in Canada.

    Campus jobs alone can get you there at 8 hours a week. Mix in tutoring, delivery apps, selling notes, or paid research studies and you can clear it easily without destroying your GPA. The key is choosing things that flex around your schedule, not the other way around.

    Download Lodavo free, link in bio.
