  caption: |
    $6,200 hit my account in September. I felt rich for the first time in my life.

    New shoes. AirPods. Uber Eats every single night. By October I had $900 left to last until April. That was the longest semester of my life.

    Next year I treated OSAP like a paycheck. Split it by week. By April I had $1,400 saved from the exact same amount.

    OSAP is not a windfall. It's a paycheck spread across eight months.

