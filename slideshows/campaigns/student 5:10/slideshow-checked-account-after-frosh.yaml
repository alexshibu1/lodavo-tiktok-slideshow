  caption: |
    Checked my account after frosh week. $47 left for the entire month.

    Three bars. Two Uber Eats orders. Campus merch I wore once. All in five days. I made one rule after that: $25 a week goes to savings before anything else.

    Week one was ramen. By October I had $200. By December I stopped panicking about money every single day.

    Frosh week cost me $400. It taught me everything I needed to know about money.

