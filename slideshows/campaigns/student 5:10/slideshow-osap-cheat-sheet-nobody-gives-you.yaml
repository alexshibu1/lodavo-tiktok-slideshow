    # RAP (repayment assistance)
    - text: "RAP: if you can't afford payments"
      sub: "earning under $40K? payments drop to $0. most people don't know this exists"
      image: { url: "https://images.pexels.com/photos/7534771/pexels-photo-7534771.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 50%"
    # How summer income affects it
    - text: "summer jobs and OSAP"
      sub: "earn over $5,600 in summer and your grant shrinks. report it accurately"
