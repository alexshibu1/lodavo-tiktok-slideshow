slideshow:
  slug: first-apartment-cost-breakdown-canada
  language: en
  account: lodavo.money
  series: student-life
  slot: "2026-12-06 19:00"
  opening: cold
  end: white
  slides:
    # Hook: reality check, dense practical info
    - text: "your first apartment actually costs this much"
      sub: "Toronto. Montreal. Vancouver. real numbers, not vibes."
      image: { url: "https://images.pexels.com/photos/4246120/pexels-photo-4246120.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 50%"
    # Toronto breakdown
    - text: "Toronto"
      sub: "1-bedroom: $2,200-$2,500/mo. studio near campus (U of T, TMU): $1,700-$2,000. add $200+ for utilities, internet, insurance"
      image: { url: "https://images.pexels.com/photos/29600768/pexels-photo-29600768/free-photo-of-toronto-skyline-with-cn-tower-and-waterfront.png?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 40%"
    # Montreal breakdown
    - text: "Montreal"
      sub: "1-bedroom: $1,400-$1,700/mo. studio near McGill or Concordia: $1,100-$1,400. hydro can be $80+ in winter. cheapest of the three"
      image: { url: "https://images.squarespace-cdn.com/content/v1/5980e801d482e93f58785fef/1572551640108-8BI8MDWYD0QWK458HX5D/cobblestone+street+of+le+vieux+port" }
      focus: "50% 50%"
    # Vancouver breakdown
    - text: "Vancouver"
      sub: "1-bedroom: $2,400-$2,800/mo. studio near UBC or SFU: $1,800-$2,200. highest rents in Canada. transit pass helps"
      image: { url: "https://images.pexels.com/photos/29072584/pexels-photo-29072584/free-photo-of-vancouver-skyline-with-mountains-and-marina.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 40%"
    # The costs nobody mentions
    - text: "costs nobody warns you about"
      sub: "tenant insurance: $20-$35/mo. internet: $50-$70/mo. laundry: $40-$60/mo. first and last month's rent upfront"
      image: { url: "https://images.pexels.com/photos/4246120/pexels-photo-4246120.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 50%"
    # Groceries and transit
    - text: "groceries and transit"
      sub: "groceries for one: $300-$400/mo. transit pass: $100-$160/mo depending on city. budget $500/mo minimum on top of rent"
      image: { url: "https://images.pexels.com/photos/6567370/pexels-photo-6567370.jpeg?cs=srgb&dl=pexels-tim-douglas-6567370.jpg&fm=jpg" }
      focus: "50% 50%"
    # The total reality check
    - text: "your real monthly total"
      sub: "Toronto: $2,800-$3,400. Montreal: $2,000-$2,600. Vancouver: $3,000-$3,600. this is what independent actually costs"
      image: { url: "https://s7ap1.scene7.com/is/image/aia/AIAGettyImages-1333748557-1?qlt=85&ts=1677554836244&dpr=off" }
      focus: "50% 50%"
    # App slide: bridge from cost of living to saving
    - app: hero
      text: "Rent's expensive. Make your savings do something?"
      sub: "Lodavo gives you a free draw ticket for every $25 saved. A chance to win every week."
  caption: |
    What your first apartment actually costs in Toronto, Montreal, and Vancouver. Save this before you sign a lease.

    Rent. Utilities. Internet. Tenant insurance. Groceries. Transit. Laundry. First and last month's deposit. It adds up way faster than you think.

    Send this to your friend who's apartment hunting.

    Download Lodavo free, link in bio.
