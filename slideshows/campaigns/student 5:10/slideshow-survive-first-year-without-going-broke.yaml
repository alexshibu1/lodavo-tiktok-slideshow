  caption: |
    First year is expensive and nobody warns you.

    Textbooks, food, going out, random fees. It adds up before October. But the students who figure it out early save hundreds without even trying. Used textbooks, stacking SPC and UNiDAYS, milking campus freebies, and keeping cash spending tight. None of this is hard. You just need to know about it.

