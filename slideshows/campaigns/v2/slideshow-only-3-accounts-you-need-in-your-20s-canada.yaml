  caption: |
    You don't need 7 accounts and 4 apps. You need 3.

    1. No-fee chequing (Simplii, Tangerine, CIBC). Stop paying $15/month to hold your own money.
    2. TFSA. $7,000/year in room starting at 18. By 25 that's $49,000 of tax-free growth.
    3. HISA for your emergency fund. Best rates in Canada right now: 4 to 4.75%.

    What NOT to open yet: RRSP. The tax deduction is worth more when your income is higher.

    The hard part isn't knowing which accounts. It's actually saving. Lodavo gives you a free ticket for every $25 you save, for a weekly draw. $100 winner every week, $10,000 jackpot.

