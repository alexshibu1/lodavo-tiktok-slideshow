    # Canadian Partnership for Responsible Gambling, Canadian Gambling Digest 2023-2024:
    # total lottery spending in Canada exceeds $9 billion/year; per-adult average ~$700/year
    # on government-run lottery products. Lower-income households spend a disproportionate
    # share of income on lottery compared to higher-income households.
    - https://www.greo.ca/en/canadian-gambling-digest.aspx
    # Provincial lottery corporation annual reports (OLG, Loto-Quebec, BCLC, WCLC):
    # prize payout ratio for major draw games (Lotto Max, Lotto 6/49) is approximately 47%
    # of ticket sales revenue; the remainder goes to government programs and operating costs.
    - https://about.olg.ca/annual-report/
    # FP Canada 2024 Financial Stress Index: 46% of Canadians say they would struggle to cover
    # an unexpected $2,500 expense. BDO Affordability Index shows similar findings.
    - https://fpcanada.ca/financial-stress-index
    # Contest rules s.4.1(a): 1 ticket per $25 of total linked balance at the Sunday 8 PM ET
