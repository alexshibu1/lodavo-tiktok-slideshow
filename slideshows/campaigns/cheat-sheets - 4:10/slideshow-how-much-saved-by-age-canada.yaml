  caption: |
    How much should you have saved by your age? Here are the Canadian benchmarks.

    By 20: $1K to $2K. By 25: $10K to $15K. By 30: one year of income. By 35: double your salary.

    The median Canadian under 35 has $10,400. If you're behind, the move is to start now, not stress about it. Save this so you can check back.

