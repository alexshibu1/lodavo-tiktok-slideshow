slideshow:
  slug: canadian-student-money-cheat-sheet
  language: en
  account: lodavo.money
  series: cheat-sheets
  slot: "2026-11-19 19:00"
  opening: cold
  end: white
  slides:
    # Hook: screams "save this", signals dense reference content
    - text: "the student money cheat sheet"
      sub: "save this. you'll need it."
      image: { url: "https://static.producer.com/wp-content/uploads/2025/07/15163201/07-money-canadian-bills-and-loonies-MC-1200.jpg" }
      focus: "50% 50%"
    # TFSA contribution limit 2026
    - text: "your TFSA limit"
      sub: "$7,000 per year. starts the year you turn 18. tax-free growth forever"
      image: { url: "https://images.pexels.com/photos/3943882/pexels-photo-3943882.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 45%"
    # Rent as percentage of income
    - text: "how much rent should cost you"
      sub: "30% of gross income, max. $3,000 a month means $900"
      image: { url: "https://images.pexels.com/photos/29726512/pexels-photo-29726512.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 50%"
    # Emergency fund target
    - text: "your emergency fund target"
      sub: "3 months of expenses. for most students that's $4,500 to $6,000"
      image: { url: "https://images.pexels.com/photos/6289065/pexels-photo-6289065.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 50%"
    # Student loan grace period
    - text: "student loan grace period"
      sub: "federal: 6 months after graduation. interest still adds up. provincial varies"
      image: { url: "https://images.pexels.com/photos/267885/pexels-photo-267885.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 50%"
    # Key tax dates every student needs
    - text: "tax dates you need"
      sub: "T4 by Feb 28. file by April 30. most get $300+ back"
      image: { url: "https://images.pexels.com/photos/6170653/pexels-photo-6170653.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
      focus: "50% 50%"
    # App slide: bridge from money knowledge to Lodavo
    - app: hero
      text: "Know the numbers. Now make saving rewarding?"
      sub: "Lodavo gives you a free draw ticket for every $25 saved. Every week."
  caption: |
    Every number a Canadian student needs to know, on one page. Save this.

    TFSA limit, rent math, emergency fund targets, loan grace periods, tax deadlines. These are the numbers nobody teaches you in class but everyone expects you to know.

    Bookmark this and come back when you need it.

    Download Lodavo free, link in bio.
