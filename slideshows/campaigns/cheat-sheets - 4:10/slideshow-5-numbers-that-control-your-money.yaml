    # 50/30/20 budgeting rule (FCAC guidance)
    - https://www.canada.ca/en/financial-consumer-agency/services/make-budget.html
    # Emergency fund recommendation (3-6 months)
    - https://www.canada.ca/en/financial-consumer-agency/services/savings-investments/savings-your-future.html
    # Average household spending in Canada (Statistics Canada)
    - https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1110022201
    # Survey of Financial Security, net worth by age group
    - https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1110001601
    # TFSA growth projections and contribution room
    - https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/tax-free-savings-account/contributions.html
    # Contest rules s.4.1(a): 1 ticket per $25 of total linked balance
