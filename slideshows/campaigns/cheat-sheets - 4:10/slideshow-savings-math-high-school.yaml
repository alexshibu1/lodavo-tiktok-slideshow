    - text: "the 50/30/20 rule"
      sub: "50% needs. 30% wants. 20% savings. on $3,000 a month that's $600 saved"
      image: { url: "https://cdn.shopify.com/s/files/1/1201/4358/files/20230528_121139.jpg?v=1685308094" }
