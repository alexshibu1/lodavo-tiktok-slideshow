  caption: |
    The savings math no one taught you in school. It should make you a little angry.

    $5 a day on coffee is $18,250 over a decade. Your streaming subs add up to $1,000+ a year. Paying the minimum on $5K in credit card debt means 20+ years and $7,000 in interest.

    But flip it. $25 a week is $1,300 a year. Move to a HISA and your $10K earns $200 instead of $1. Meal prep saves $2,496 a year. The math works both ways.

    Download Lodavo free, link in bio.
